<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOIN</title>
    <link rel="shortcut icon" href="../assets/img/join_logo.svg" type="image/x-icon" />
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/issueCollector.css" />
</head>

<body style="background: #2A3647;">


    <main class="mainContent" style="margin-top: 0 !important;min-height: 100vh;display: flex;justify-content: center;align-items: center;padding: 20px 16px;">
        <div class="welcome-content">
    
            <header class="welcome-header">
                <h1>Welcome</h1>
            </header>
    
            <p>Pick the option that suits your role: create a request as a stakeholder or log in if you're part of the team.
            </p>

            <div class="options-container">
                <div>
                    <header class="option-header">
                        <img src="../assets/img/work.svg" alt="Stakeholder icon">
                        <span>Are you a stakeholder?</span>
                    </header>
                    <a href="./stakeholder.html">
                        <button aria-label="Create a new request" class="btn btn-primary"> Create Request </button>
                    </a>
                </div>
    
                <div>
                    <header class="option-header">
                        <img src="../assets/img/team.svg" alt="Team member icon" class="option-icon">
                        <span>Are you a team member?</span>
                    </header>
                    <a href="./login.html">
                        <button aria-label="Team member login" class="btn btn-secondary">Member log in </button>
                    </a>
                </div>
            </div>
    
        </div>
    </main>
    
</body>

</html>
