<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="shortcut icon" href="../assets/img/join_logo.svg" type="image/x-icon">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/signup.css">
    <link rel="stylesheet" href="../styles/contactAvatar.css">
    <!-- JS files -->
    <script src="../scripts/config.js" defer></script>
    <script src="../node_modules/dompurify/dist/purify.min.js"></script>
    <script src="../scripts/firebase.js"></script>
    <script src="../scripts/templates.js" defer></script>
    <script src="../scripts/signup.js" defer></script>
    <script src="../scripts/signup-password.js" defer></script>
    <script src="../script.js" defer></script>
    <script src="../scripts/contacts.js" defer></script>
</head>

<body>
    <header>
        <img src="../assets/img/join_logo.svg" alt="join logo">
    </header>
    <main class="signup-container">
        <dialog id="signupDialog" class="dialog-design"></dialog>
        <div class="user-form-container">
            <div class="headline-container">
                <div class="btn-arrow-container">
                    <div class="btn-arrow-left">
                        <a href="../index.html">
                            <img class="img-arrow-left" src="../assets/img/arrow_left_line_default.svg"
                                alt="blue arrow button">
                        </a>
                    </div>
                </div>
                <div class="headline-space">
                    <div class="headline-box">
                        <span>Sign up</span>
                        <hr class="headline-underline">
                    </div>
                </div>
            </div>
            <form onsubmit="createUser(); return false" autocomplete="off" novalidate>
                <div class="input-container">
                    <input type="text" placeholder="Name" class="bg-input bg-img-name" id="create_name"
                        onfocus="clearBorderClass('create_name', 'name_info')" onblur="checkNameInput()">
                
                    <span id="name_info" class="info-input invisible">Name must be at least 3 characters</span>
                </div>                
                <div class="input-container">
                    <input type="mail" required placeholder="Email" class="bg-input bg-img-mail" id="create_mail"
                        onclick="clearBorderClass('create_mail', 'mail_info')" onblur="checkMailInput()">
                    <span id="mail_info" class="info-input invisible">Invalid mail</span>
                </div>
                <div class="input-container">
                    <input type="password" required placeholder="Password" class="bg-input bg-img-lock" id="create_pw">
                    <span id="togglePassword" class="toggle-icon "></span>
                </div>
                <div class="input-container">
                    <div class="input-container">
                    <input type="password" required placeholder="Confirm Password" class="bg-input bg-img-lock"
                        id="create_confirm_pw"
                        onfocus="clearBorderClass('create_confirm_pw', 'confirm_pw_info')" onblur="checkPassword()">
                        <span id="toggleConfirmPassword" class="toggle-icon "></span>
                        <span id="confirm_pw_info" class="info-input invisible">Your passwords don't match. Try again.</span>
                     </div>       
                </div>

                <div class="check-policy-container">
                    <div id="checkbox" class="checkbox-unchecked" onclick="acceptPolicy()"></div>
                    <span>I accept the <a href="privacy-policy-login.html">Privacy policy</a></span>
                </div>

                <div class="btn-box">
                    <button id="btn_signup" class="btn-signup">Sign up</button>
                </div>
            </form>
        </div>
    </main>
    <footer>
        <div class="footer-box">
            <a href="privacy-policy-login.html">Privacy Policy</a>
            <a href="legal-notice-login.html">Legal notice</a>
        </div>
    </footer>
    <div id="orientation_warning" class="landscape-view-warning d-none">
        <p>JOIN works best in portrait mode. Please rotate your device!</p>
        <img class="device-icon" src="../assets/img/device_landscape.svg" alt="A tablet positioned in landscape view">
    </div>
</body>

</html>
